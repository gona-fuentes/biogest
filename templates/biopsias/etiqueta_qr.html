<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Etiqueta Frasco - {{ muestra.numero_correlativo }}</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
        body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background-color: #f1f5f9; padding: 10px; }
        .label-card {
            width: 75mm;
            height: 48mm;
            background-color: #ffffff;
            border: 2px dashed #0f172a;
            border-radius: 6px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }
        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1.5px solid #0f172a;
            padding-bottom: 4px;
        }
        .brand-title { font-size: 10px; font-weight: 900; text-transform: uppercase; color: #064e3b; letter-spacing: 0.5px; }
        .date-badge { font-size: 8px; font-weight: 700; color: #475569; }
        
        .body-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 4px 0;
        }
        .info-col { flex: 1; min-width: 0; }
        .correlativo { font-size: 15px; font-weight: 900; color: #0f172a; line-height: 1.1; margin-bottom: 3px; }
        .data-line { font-size: 9px; color: #1e293b; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .data-line strong { font-weight: 800; color: #0f172a; }
        
        .qr-col { width: 38mm; height: 38mm; display: flex; justify-content: center; align-items: center; }
        .qr-col img { width: 100%; height: 100%; object-fit: contain; }

        .footer-row {
            border-top: 1px solid #cbd5e1;
            padding-top: 3px;
            text-align: center;
            font-size: 7.5px;
            font-weight: 800;
            color: #064e3b;
            text-transform: uppercase;
        }

        @media print {
            body { background: none; padding: 0; }
            .label-card { border: 1px solid #000; box-shadow: none; page-break-inside: avoid; }
        }
    </style>
</head>
<body>
    <div class="label-card">
        <div class="header-row">
            <span class="brand-title">Biogest Trazabilidad</span>
            <span class="date-badge">{{ muestra.fecha_recepcion|date:"d/m/Y" }}</span>
        </div>
        <div class="body-row">
            <div class="info-col">
                <div class="correlativo">{{ muestra.numero_correlativo }}</div>
                <div class="data-line"><strong>Pac:</strong> {{ muestra.paciente.nombre_completo }}</div>
                <div class="data-line"><strong>RUT:</strong> {{ muestra.paciente.rut }}</div>
                <div class="data-line"><strong>Exa:</strong> {{ muestra.tipo_examen.nombre }}</div>
            </div>
            <div class="qr-col" id="qr-container"></div>
        </div>
        <div class="footer-row">
            Muestra Histopatológica - Uso Exclusivo Laboratorio
        </div>
    </div>

    <script>
        // Generar el QR
        new QRCode(document.getElementById("qr-container"), {
            text: "{{ muestra.numero_correlativo }}",
            width: 140,
            height: 140,
            colorDark: "#000000",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.H
        });

        // Imprimir automáticamente y cerrar ventana
        setTimeout(() => {
            window.print();
            window.close();
        }, 500);
    </script>
</body>
</html>
