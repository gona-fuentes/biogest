<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Biogest - Trazabilidad{% endblock %}</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        clinica: '#064e3b', // Verde oscuro intenso
                        patologia: '#10b981', // Verde esmeralda (acciones y alertas)
                        critico: '#ef4444', // Rojo para alertas críticas
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased min-h-screen flex flex-col">

    <nav class="bg-clinica text-white shadow-md bg-gradient-to-r from-clinica to-gray-900">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            
            <a href="{% url 'inicio' %}" class="text-xl font-bold tracking-wider hover:text-gray-200 transition flex items-center gap-2">
                <i class="fa-solid fa-microscope"></i> BIOGEST
            </a>
            
            <div>
                {% if user.is_authenticated %}
                    <span class="mr-4 text-sm"><i class="fa-solid fa-user-md mr-1"></i>Hola, <strong>{{ user.username }}</strong></span>
                    <form action="{% url 'logout' %}" method="post" class="inline">
                        {% csrf_token %}
                        <button type="submit" class="bg-red-600 hover:bg-red-700 px-3 py-1 rounded text-sm transition shadow">Salir</button>
                    </form>
                {% endif %}
            </div>
        </div>
    </nav>

    <main class="flex-grow max-w-7xl w-full mx-auto px-4 py-6">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="bg-white border-t border-gray-200 py-4 text-center text-xs text-gray-500">
        &copy; 2026 Biogest - Sistema de Trazabilidad Patológica
    </footer>

</body>
</html>
